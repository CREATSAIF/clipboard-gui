name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0)'
        required: true

jobs:
  build-binaries:
    name: Build clipboard-gui (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: clipboard-gui-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: clipboard-gui-windows-x86_64.exe
          # macOS cross-compile from a Linux runner is non-trivial — the
          # egui/winit stack pulls in macOS-specific frameworks (Cocoa,
          # Metal) that aren't available on the ubuntu-latest runner. To
          # add macOS back, add another matrix entry with
          #   os: macos-latest
          #   target: x86_64-apple-darwin
          # and the job will run on a native macOS image.
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} --bin clipboard-gui

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p stage
          if [ "${{ matrix.target }}" = "x86_64-pc-windows-msvc" ]; then
            cp target/${{ matrix.target }}/release/clipboard-gui.exe stage/${{ matrix.artifact }}
          else
            cp target/${{ matrix.target }}/release/clipboard-gui stage/${{ matrix.artifact }}
          fi
          chmod +x stage/${{ matrix.artifact }} 2>/dev/null || true
          cd stage && sha256sum "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: stage/${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 30

  github-release:
    name: GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.sha256
            artifacts/**/clipboard-gui*
          fail_on_unmatched_files: false
